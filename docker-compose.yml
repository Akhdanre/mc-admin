services:
  mc-admin:
    image: ghcr.io/akhdanre/mc-admin:latest
    container_name: mc-admin
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RCON_HOST=${RCON_HOST:-mc-server}
      - RCON_PORT=${RCON_PORT:-25575}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - RCON_TIMEOUT_MS=${RCON_TIMEOUT_MS:-5000}
      - NEXT_PUBLIC_MAP_URL=${NEXT_PUBLIC_MAP_URL:-http://localhost:8123}
      - MC_DATA_PATH=/data
      - MC_BACKUPS_PATH=/backups
    volumes:
      # Minecraft world data & logs (read-write for admin config persistence)
      - ./data:/data:rw
      # Backup target directory (read-write for backup creation & pruning)
      - ./backups:/backups:rw
    networks:
      - default

networks:
  default:
    name: minecraft_default
    external: true
